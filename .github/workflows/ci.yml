name: CI

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    container: swift:latest
    steps:
    - uses: actions/checkout@v7.0.1
    - run: swift test --only-use-versions-from-resolved-file --enable-swift-testing --parallel --filter OfflineTests
  integration:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    container: swift:latest
    steps:
    - uses: actions/checkout@v7.0.1
    - run: swift test --only-use-versions-from-resolved-file --enable-swift-testing --parallel --skip OfflineTests
      env:
        ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
        IMAGES_API_TOKEN: ${{ secrets.IMAGES_API_TOKEN }}
        EMAIL_SERVICE_API_TOKEN: ${{ secrets.EMAIL_SERVICE_API_TOKEN }}
  lint:
    runs-on: ubuntu-24.04-arm
    container: swift:latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: swift format lint -r -p -s .
